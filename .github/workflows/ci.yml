name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & format (root, server, verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:prettier:check
      - run: npm run lint:server
      - run: npm run lint:verification

  test-server:
    name: Build & test server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  build-verification-api:
    name: Build verification_api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verification_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: verification_api/package-lock.json
      - run: npm ci
      - run: npm run build

  build-verification-portal:
    name: Build verification_portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verification_portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: verification_portal/package-lock.json
      - run: npm ci
      - run: npm run build

  flutter-analyze:
    name: Analyze & format Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
      - working-directory: app
        run: flutter pub get
      - run: npm run format:app:check
      - run: npm run lint:app

  move-test:
    name: Move contract tests
    runs-on: ubuntu-latest
    env:
      SUI_RELEASE_TAG: testnet-v1.78.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Sui CLI
        run: |
          curl -sSfL -o sui.tgz \
            "https://github.com/MystenLabs/sui/releases/download/${SUI_RELEASE_TAG}/sui-${SUI_RELEASE_TAG}-ubuntu-x86_64.tgz"
          mkdir -p "$HOME/.local/bin"
          tar -xzf sui.tgz -C "$HOME/.local/bin" ./sui
          rm sui.tgz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - working-directory: contracts
        run: sui move test
